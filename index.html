<!-- =========================================================
     FLOWTECH PREMIUM UPGRADE
     فقط افزونه است؛ کد اصلی قبلی حذف نشده است.

<style>

/* =========================================================
   PREMIUM VISUAL UPGRADE
========================================================= */

:root{
    --ft-cyan:#00e5ff;
    --ft-green:#00ffa3;
    --ft-blue:#4f7cff;
    --ft-purple:#9b6cff;
    --ft-bg:#07141b;
    --ft-card:rgba(255,255,255,.045);
    --ft-border:rgba(255,255,255,.09);
}

body{
    background:
        radial-gradient(circle at 15% 15%,rgba(0,229,255,.12),transparent 25%),
        radial-gradient(circle at 85% 25%,rgba(155,108,255,.10),transparent 25%),
        radial-gradient(circle at 50% 90%,rgba(0,255,163,.08),transparent 30%),
        #07141b;
}

/* animated background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

/* header */

header{
    background:rgba(5,17,24,.72);
    box-shadow:
        0 10px 50px rgba(0,0,0,.25),
        inset 0 -1px rgba(0,229,255,.05);
}

.navbar{
    max-width:1350px;
}

.logo-icon{
    position:relative;
    overflow:hidden;
    box-shadow:
        0 0 25px rgba(0,229,255,.2),
        0 0 70px rgba(0,255,163,.08);
}

.logo-icon::after{
    content:"";
    position:absolute;
    inset:-100%;
    background:linear-gradient(
        45deg,
        transparent 40%,
        rgba(255,255,255,.5),
        transparent 60%
    );
    transform:translateX(-50%) rotate(25deg);
    animation:logoShine 4s infinite;
}

@keyframes logoShine{
    0%,65%{transform:translateX(-80%) rotate(25deg)}
    100%{transform:translateX(80%) rotate(25deg)}
}

.nav-links a{
    position:relative;
}

.nav-links a:not(.nav-cta)::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-7px;
    width:0;
    height:2px;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        var(--ft-cyan),
        var(--ft-green)
    );
    transition:.3s;
    transform:translateX(-50%);
}

.nav-links a:not(.nav-cta):hover::after{
    width:70%;
}

/* hero */

.hero{
    max-width:1350px;
    min-height:720px;
    position:relative;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h1{
    text-shadow:
        0 0 35px rgba(0,229,255,.08);
}

.hero h1 span{
    text-shadow:
        0 0 35px rgba(0,229,255,.22);
}

.badge{
    box-shadow:
        0 0 30px rgba(0,229,255,.06);
}

.tech-display{
    filter:
        drop-shadow(0 30px 50px rgba(0,0,0,.35));
}

.phone{
    box-shadow:
        0 35px 80px rgba(0,0,0,.65),
        0 0 80px rgba(0,229,255,.08);
    position:relative;
}

.phone::before{
    content:"";
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:75px;
    height:19px;
    border-radius:20px;
    background:#02080b;
    z-index:3;
}

.phone-screen{
    overflow:hidden;
    position:relative;
}

.phone-screen::before{
    content:"";
    position:absolute;
    width:180%;
    height:180%;
    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(0,229,255,.08),
            transparent,
            rgba(0,255,163,.08),
            transparent
        );
    animation:phoneRotate 9s linear infinite;
}

@keyframes phoneRotate{
    to{
        transform:rotate(360deg);
    }
}

/* sections */

.section-title h2{
    text-shadow:
        0 0 25px rgba(0,229,255,.06);
}

.category-card,
.feature,
.filter-panel,
.info-box{
    box-shadow:
        0 15px 45px rgba(0,0,0,.12);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.category-card:hover,
.feature:hover{
    box-shadow:
        0 20px 60px rgba(0,229,255,.07);
}

/* filter */

.filter-panel{
    position:relative;
    overflow:hidden;
}

.filter-panel::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--ft-cyan),
        var(--ft-green),
        transparent
    );
    opacity:.7;
}

.search-box input{
    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.025),
            rgba(0,0,0,.25)
        );
}

/* products */

.products-grid{
    gap:22px;
}

.product-card{
    overflow:hidden;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.product-card::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--ft-cyan),
        var(--ft-green),
        transparent
    );
    transition:.5s;
}

.product-card:hover::before{
    left:100%;
}

.product-card:hover{
    transform:translateY(-9px) scale(1.01);
    box-shadow:
        0 25px 65px rgba(0,0,0,.35),
        0 0 35px rgba(0,229,255,.035);
}

.product-icon{
    box-shadow:
        inset 0 0 25px rgba(0,229,255,.03);
    transition:.35s;
}

.product-card:hover .product-icon{
    transform:scale(1.08) rotate(-3deg);
    box-shadow:
        0 0 30px rgba(0,229,255,.08);
}

.product-brand{
    box-shadow:
        0 0 18px rgba(0,255,163,.04);
}

/* buttons */

.primary-button,
.product-button,
.nav-cta{
    position:relative;
    overflow:hidden;
}

.primary-button::after,
.product-button::after,
.nav-cta::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    transform:skewX(-25deg);
    background:rgba(255,255,255,.15);
    transition:.45s;
}

.primary-button:hover::after,
.product-button:hover::after,
.nav-cta:hover::after{
    left:140%;
}

/* modal */

.details-box{
    box-shadow:
        0 30px 120px rgba(0,0,0,.75),
        0 0 60px rgba(0,229,255,.05);
}

.detail-item{
    transition:.25s;
}

.detail-item:hover{
    border-color:rgba(0,229,255,.2);
    background:rgba(0,229,255,.045);
    transform:translateY(-2px);
}

/* toast */

.toast{
    box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        0 0 25px rgba(0,229,255,.05);
}

/* responsive */

@media(max-width:650px){

    .hero{
        min-height:650px;
    }

    .product-card:hover{
        transform:translateY(-5px);
    }

}

/* product loading */

.ft-product-loading{
    text-align:center;
    padding:35px;
    color:#78919a;
}

.ft-product-loading span{
    display:inline-block;
    width:8px;
    height:8px;
    margin:4px;
    border-radius:50%;
    background:#00e5ff;
    animation:ftDot 1s infinite alternate;
}

.ft-product-loading span:nth-child(2){
    animation-delay:.2s;
}

.ft-product-loading span:nth-child(3){
    animation-delay:.4s;
}

@keyframes ftDot{
    from{
        transform:translateY(0);
        opacity:.3;
    }
    to{
        transform:translateY(-8px);
        opacity:1;
    }
}

/* extra filter chips */

.ft-search-info{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.ft-chip{
    padding:5px 9px;
    border-radius:30px;
    font-size:9px;
    color:#9bb5bd;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
}

.ft-chip strong{
    color:#00e5ff;
}

/* category count */

.ft-category-count{
    display:inline-block;
    margin-top:9px;
    padding:3px 8px;
    border-radius:20px;
    font-size:9px;
    color:#00e5ff;
    background:rgba(0,229,255,.06);
    border:1px solid rgba(0,229,255,.08);
}

/* huge catalog indicator */

.ft-catalog-badge{
    margin-top:12px;
    display:inline-flex;
    padding:7px 12px;
    border-radius:30px;
    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.07),
            rgba(0,255,163,.05)
        );
    border:1px solid rgba(0,229,255,.1);
    color:#8eaab2;
    font-size:10px;
}

.ft-catalog-badge b{
    color:#00ffa3;
    margin-right:5px;
}

</style>

function ftNormalize(value){

        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/أ/g,"ا")
        .replace(/إ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g," ")
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/[^\p{L}\p{N}\s.+-]/gu," ")
        .replace(/\s+/g," ")
        .trim();

}

--------------------------------------------------------- */

    "گیم پد":"controller",
    "کنترلر":"controller"

};


function ftTranslateSearch(value){

    let text = ftNormalize(value);

    Object.keys(ftAliases)
        .sort((a,b)=>b.length-a.length)
        .forEach(function(key){

            const normalized =
                ftNormalize(key);

            text =
                text.replace(
                    new RegExp(
                        normalized.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),
                        "gi"
                    ),
                    " " +
                    ftAliases[key] +
                    " "
                );

        });

    return ftNormalize(text);

}


/* ---------------------------------------------------------
   Product factory
--------------------------------------------------------- */

function ftProduct(
    name,
    brand,
    type,
    index,
    category,
    specs
){

    const finalSpecs =
        specs || {

            "نمایشگر":
                category === "mobile"
                ? "نمایشگر با کیفیت مناسب استفاده روزمره و حرفه‌ای"
                :
                category === "tablet"
                ? "نمایشگر بزرگ با وضوح بالا"
                :
                category === "laptop"
                ? "نمایشگر Full HD یا بالاتر بسته به نسخه"
                :
                "طراحی دیجیتال مدرن و مناسب استفاده روزمره",

            "پردازنده":
                "پردازنده اختصاصی دستگاه، بسته به نسخه",

            "حافظه":
                "حافظه داخلی بسته به نسخه",

            "اتصالات":
                "Bluetooth، Wi-Fi، USB و سایر اتصالات بسته به مدل"

        };

    return {

        name:name.toLowerCase(),

        brand:brand,

        type:type,

        faName:
            ftPersianBrand(brand)
            +
            " "
            +
            ftPersianType(type)
            +
            " "
            +
            name,

        specs:finalSpecs,

        _mega:true,

        _category:category,

        _index:index

    };

}

/* =========================================================
   SEARCH ENGINE OVERRIDE
========================================================= */

function ftProductSearchText(product){

    let text =
        [
            product.name,
            product.faName,
            product.brand,
            product.type,
            product._category,
            Object.keys(product.specs || {}).join(" "),
            Object.values(product.specs || {}).join(" ")
        ]
        .join(" ");

    return ftTranslateSearch(text);

}


function ftSearchMatches(
    product,
    search
){

    if(!search){
        return true;
    }

    const query =
        ftTranslateSearch(search);

    const terms =
        query
        .split(/\s+/)
        .filter(Boolean);

    const haystack =
        ftProductSearchText(product);

    return terms.every(function(term){

        return haystack.includes(term);

    });

}

    const search =

    const brand =
        brandFilter.value;

    const type =
        typeFilter.value;


    let visibleProducts =
        products.filter(function(product){

            const index =
                Number(
                    product.querySelector(
                        ".details-button"
                    )?.dataset.index
                );


            const data =
                realProducts[index];


            if(!data){
                return false;
            }


            const searchMatch =
                ftSearchMatches(
                    data,
                    search
                );


            const brandMatch =
                brand==="all"
                ||
                data.brand===brand;


            let typeMatch =
                type==="all"
                ||
                data.type===type;


            /* gadget subtype */

            if(
                gadgetSubtypes
                .some(
                    item=>item[0]===type
                )
            ){

                const productText =
                    ftProductSearchText(data);

                typeMatch =
                    productText.includes(
                        type
                    );

            }


            return (
                searchMatch &&
                brandMatch &&
                typeMatch
            );

        });


    sortProducts(visibleProducts);


    products.forEach(function(product){

        product.style.display="none";

    });


    visibleProducts.forEach(function(product){

        product.style.display="block";

    });


    resultCount.textContent =
        new Intl.NumberFormat("fa-IR")
        .format(
            visibleProducts.length
        )
        +
        " محصول نمایش داده می‌شود";


    noProducts.style.display =
        visibleProducts.length===0
        ? "block"
        : "none";


    loadFavorites();

};
